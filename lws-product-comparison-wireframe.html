    const GROUPS = [{"group": "PROTECTION APPROACH", "rows": [["How it works", "App on the worker’s own smartphone", "LWS app plus a separate Bluetooth panic button", "Dedicated safety device carried by the worker"], ["What the worker carries", "Their own smartphone (Android & Apple)", "Smartphone + panic button", "The Advanced device — no personal phone needed"], ["How an alert is raised", "From the app", "From the button or the app — designed for discreet activation", "TBC"]]}, {"group": "WORKING ENVIRONMENT", "rows": [["Working environment", "Lone, remote or mobile workers", "Where the phone may not be reachable at the moment it is needed", "Where environments or policies call for standalone, purpose-built equipment"], ["Risk level", "Low–medium", "TBC", "TBC"], ["Organisation size", "10–5,000 employees", "TBC", "TBC"], ["Deployment", "Typically 48 hours", "TBC", "TBC"]]}, {"group": "ALERTING", "rows": [["Alarm from the app", "✓ Included", "✓ Included", "— Not part of this level"], ["Separate physical panic button", "— Not part of this level", "✓ Included", "TBC"], ["Dedicated safety device", "— Not part of this level", "— Not part of this level", "✓ Included"], ["Independent of a personal phone", "— Not part of this level", "— Not part of this level", "✓ Included"]]}, {"group": "LOCATION & CHECK-INS", "rows": [["GPS location sharing", "✓ Included", "TBC", "TBC"], ["Welfare check timers", "✓ Included", "TBC", "TBC"], ["Activity sessions", "✓ Included", "TBC", "TBC"]]}, {"group": "PLATFORM", "rows": [["Real-time dashboard", "✓ Included", "TBC", "TBC"], ["Incident reporting", "✓ Included", "TBC", "TBC"], ["Push notifications", "✓ Included", "TBC", "TBC"]]}, {"group": "ALERT & RESPONSE", "rows": [["Monitoring options", "Self-monitored or 24/7 professional", "Self-monitored or 24/7 professional", "Self-monitored or LWS professional monitoring"]]}];

}

const comp = new Component({});
const tpl = document.getElementById('tpl');
const mount = document.getElementById('app');
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.'); let v = scope;
  for (const p of parts){ if (v == null) return undefined; v = v[p]; }
  return v;
}
function whole(str){ const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }
function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function renderNode(n, scope, out){
  if (n.nodeType === 3){ out.push(document.createTextNode(interp(n.nodeValue, scope))); return; }
  if (n.nodeType !== 1) return;
  const tag = n.localName;
  if (tag === 'sc-for'){
    const list = look(whole(n.getAttribute('list')), scope) || [];
    const as = n.getAttribute('as') || 'item';
    list.forEach((item, idx) => { const sc = Object.create(scope); sc[as] = item; sc.$index = idx; n.childNodes.forEach(c => renderNode(c, sc, out)); });
    return;
  }
  if (tag === 'sc-if'){ if (look(whole(n.getAttribute('value')), scope)) n.childNodes.forEach(c => renderNode(c, scope, out)); return; }
  const el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(n.namespaceURI, n.tagName) : document.createElement(tag);
  for (const a of n.attributes){
    const w = whole(a.value);
    if (a.name.startsWith('on') && w){ const fn = look(w, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    if (a.name.startsWith('hint-')) continue;
    el.setAttribute(a.name, interp(a.value, scope));
  }
  const kids = []; n.childNodes.forEach(c => renderNode(c, scope, kids)); kids.forEach(k => el.appendChild(k));
  out.push(el);
}
function render(){
  const vals = comp.renderVals(); const out = [];
  tpl.content.childNodes.forEach(c => renderNode(c, vals, out));
  mount.replaceChildren(...out);
}
render();
